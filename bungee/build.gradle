plugins {
    id 'net.minecrell.plugin-yml.bungee' version '0.6.0'
}

dependencies {
    implementation 'org.bstats:bstats-bungeecord:3.2.1'
    implementation project(':shared')
    implementation project(':proxy')
    compileOnly 'net.md-5:bungeecord-api:26.1-R0.1-SNAPSHOT'
}

bungee {
    main = 'com.lauriethefish.betterportals.bungee.BetterPortals'
    author = 'lauriethefish@outlook.com'
    version = project.version
    name = 'BetterPortals'
    description = 'Proxy side plugin for BetterPortals which helps to allow cross-server portals'
}
