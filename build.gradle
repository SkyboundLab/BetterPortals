plugins {
    id 'java'
}

allprojects {
    apply plugin: 'java'

    group = "com.lauriethefish.betterportals"

    // Optional, just for showing name
    afterEvaluate {
        println("Evaluating project ${project.group}:${project.name}:${version}")
    }

    test {
        useJUnitPlatform()
    }

    repositories {
        mavenCentral()
        // BungeeCord/Waterfall snapshots (Sonatype OSSRH was sunset, snapshots live here now)
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        // ProtocolLib snapshot builds (26.3 support)
        maven { url 'https://repo.dmulloy2.net/nexus/repository/public/' }
    }

    compileJava.options.encoding = 'UTF-8'

    dependencies {
        implementation 'com.google.inject:guice:7.0.0'
        implementation 'com.google.inject.extensions:guice-assistedinject:7.0.0'
        implementation 'org.jetbrains:annotations:26.1.0'
        implementation 'com.google.code.findbugs:jsr305:3.0.2'

        compileOnly 'org.projectlombok:lombok:1.18.48'
        testImplementation 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

jar.enabled = false
build.enabled = false

subprojects {
    if (System.getenv('BP_DEVELOPER_BUILD') == '1') {
        version = gradle.ext.versionName + '-' + "git rev-parse --verify --short HEAD".execute().text.trim().toLowerCase()
    } else {
        version = gradle.ext.versionName
    }

    base {
        archivesName = "${rootProject.name}-${project.name}"
    }
}
